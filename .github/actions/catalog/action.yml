# SPDX-License-Identifier: AGPL-3.0-only
# The catalog's publishable build (ADR 0034, ADR 0050, ADR 0069), shared by release.yml's `catalog`
# job and catalog-release.yml, so a release and a catalog-only publish build the catalog the same
# way and never disagree about what's in it. A composite action, GitHub's way to reuse a job's
# steps (https://docs.github.com/en/actions/sharing-automations/creating-actions/creating-a-composite-action):
# the calling job keeps its own name, `needs` and `environment`, and passes the release key in as
# inputs, since a composite action can't read secrets itself
# (https://docs.github.com/en/actions/reference/workflows-and-actions/metadata-syntax#inputs).
# The job checks out the commit (and anything a release prepared) before it.
name: Catalog build
description: Build and sign both channels with the release key, check production trusts it, and upload it
inputs:
  catalog-key:
    description: The release key's private PEM (HIGHSEA_CATALOG_KEY)
    required: true
  catalog-key-id:
    description: The release key's id (HIGHSEA_CATALOG_KEY_ID)
    required: true
  dry-run:
    description: "'true' signs with the development key when there's no release key and uploads nothing for Pages"
    required: true
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.4
    - run: bun install --frozen-lockfile
      shell: bash
    # signed first, then checked, as the image job does: the trust check reads the seed too, and
    # the committed seed is signed with the development key until a release signs it. The seed
    # written here isn't published; the catalog in dist/catalog is
    - name: Build and sign both channels
      run: bun scripts/catalog.ts build --seed
      shell: bash
      env:
        HIGHSEA_CATALOG_KEY: ${{ inputs.catalog-key }}
        HIGHSEA_CATALOG_KEY_ID: ${{ inputs.catalog-key-id }}
        HIGHSEA_CATALOG_SEED_RELEASE: '1'
    # production servers trust release keys only (ADR 0034): a real run stops here without one; a
    # dry run says so and signs with the development key
    - name: Production servers will trust it
      run: bun scripts/release.ts trust || { [ "$DRY_RUN" = true ] && echo "::warning::A real run would stop here."; }
      shell: bash
      env:
        HIGHSEA_CATALOG_KEY_ID: ${{ inputs.catalog-key-id }}
        DRY_RUN: ${{ inputs.dry-run }}
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: catalog
        path: dist/catalog/
    - if: ${{ inputs.dry-run != 'true' }}
      uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
      with:
        path: dist/catalog/
