# SPDX-License-Identifier: AGPL-3.0-only
# The native builds of the one client (apps/client, ADR 0059 and 0061; one-client-platform-b.md ›
# B2 brings this piece of part C forward): in the heavy tier (below), on the
# changes that could reach them, the client's types and Jest tests, its iPhone project generated
# with `expo prebuild`
# (https://docs.expo.dev/workflow/prebuild/), the licence audit over its pods, and the app built for
# the iOS simulator with xcodebuild, signed ad hoc (`CODE_SIGN_IDENTITY=-`, no certificate): an
# unsigned build gets no keychain entitlement, so it can't keep a sign-in, which
# scripts/sweeps/phone.ts found. The Apple TV's is built the same way for the tvOS simulator, its
# project from `EXPO_TV=1 expo prebuild` (`prebuild:tv`, https://docs.expo.dev/guides/building-for-tv/).
# Nothing is signed with a certificate or uploaded here, and there are no EAS builds
# (phase-4-checkpoint-5.md's answer 10). Android joins in 4.5c. The paths are the client and every
# workspace package, since it reaches most of them through @highsea-tv/sdk and @highsea-tv/client.
#
# The runner's Xcode must be one Expo SDK 58 supports, so the image is macOS 26's
# (https://github.com/actions/runner-images). Each action is pinned to a full commit SHA, with its
# version beside it.
name: Native

# The heavy tier (ADR 0062, next-branch.md › CI by branch): it runs on a push to next, a pull
# request into main, and a pull request with the `full-ci` label. The pull request trigger has no
# branch filter, so a pull request into next with the label gets here, and `labeled` joins the
# default types so adding the label starts it
# (https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#pull_request).
# A push to main runs only ci.yml's `check` (the owner's answer 3). The jobs' `if:` holds the rest:
# a pull request into another branch without the label skips them, and a job its `if:` skips
# reports success rather than leaving a check pending
# (https://docs.github.com/en/pull-requests/how-tos/merge-and-close-pull-requests/troubleshooting-required-status-checks#handling-skipped-but-required-checks).
# `github.base_ref` is the base branch, and `contains()` looks for the label among
# `github.event.pull_request.labels`' names
# (https://docs.github.com/en/actions/reference/workflows-and-actions/expressions#contains).
on:
  push:
    branches: [next]
    paths:
      - 'apps/client/**'
      - 'packages/**'
      - 'bun.lock'
      - 'package.json'
      - 'scripts/license-audit.ts'
      - '.github/workflows/native.yml'
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'apps/client/**'
      - 'packages/**'
      - 'bun.lock'
      - 'package.json'
      - 'scripts/license-audit.ts'
      - '.github/workflows/native.yml'

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios:
    # the heavy tier's condition (the comment above `on:`)
    if: &heavy >-
      (github.event_name == 'pull_request'
        && (github.base_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'full-ci')))
      || (github.event_name == 'push' && github.ref == 'refs/heads/next')
      || (github.event_name != 'pull_request' && github.event_name != 'push')
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # the Jest tests render every form factor (the TV's and touch's among them), so they run once
      - name: Types and the Jest tests
        working-directory: apps/client
        run: |
          bun run typecheck
          bun run test --ci
      # the phone's bundle draws with ui's native renderer only, and no `.web` side (ADR 0060, 0061)
      - name: The bundle carries no web renderer
        run: bun scripts/bundles.ts client-phone
      # the generated project, with its pods installed (prebuild runs `pod install`)
      - name: The iOS project
        working-directory: apps/client
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: bun run prebuild
      - name: Licences, with the pods
        run: bun run licenses
      - name: The app, for the simulator
        working-directory: apps/client/ios
        run: |
          xcodebuild -workspace highsea.xcworkspace -scheme highsea -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO build

  tvos:
    if: *heavy
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # the TV's bundle draws with ui's native renderer only, and no `.web` side (ADR 0060, 0061)
      - name: The bundle carries no web renderer
        run: bun scripts/bundles.ts client-tv
      - name: The tvOS project
        working-directory: apps/client
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: bun run prebuild:tv
      - name: Licences, with the pods
        run: bun run licenses
      - name: The app, for the simulator
        working-directory: apps/client/ios
        run: |
          xcodebuild -workspace highsea.xcworkspace -scheme highsea -configuration Release \
            -sdk appletvsimulator -destination 'generic/platform=tvOS Simulator' \
            -derivedDataPath build CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO build
