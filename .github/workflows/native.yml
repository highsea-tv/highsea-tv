# SPDX-License-Identifier: AGPL-3.0-only
# The native builds of the one client (apps/client, ADR 0059 and 0061; one-client-platform-b.md ›
# B2 brings this piece of part C forward): in the heavy tier (below), the iPhone project generated
# with `expo prebuild`
# (https://docs.expo.dev/workflow/prebuild/), the licence audit over its pods, and the app built for
# the iOS simulator with xcodebuild, signed ad hoc (`CODE_SIGN_IDENTITY=-`, no certificate): an
# unsigned build gets no keychain entitlement, so it can't keep a sign-in, which
# scripts/sweeps/phone.ts found. The Apple TV's is built the same way for the tvOS simulator, its
# project from `EXPO_TV=1 expo prebuild` (`prebuild:tv`, https://docs.expo.dev/guides/building-for-tv/).
# Nothing is signed with a certificate or uploaded here, and there are no EAS builds
# (phase-4-checkpoint-5.md's answer 10). Android joins in 4.5c. A push to next builds whatever it
# changed, and a pull request into next only what touches the native side (below).
#
# The client's types and Jest tests ran here too until 2026-11-17, on top of CI's fast tier, which
# runs both on every pull request and push (`bun run typecheck` takes in every workspace, and the
# `tests` job's Jest shards are the same `jest` with the same config): 20 minutes of the iPhone
# job repeated what Linux had already checked. Jest's preset is iOS's whatever the host
# (apps/client/jest.config.js), so the host changes nothing.
#
# No compiler or build cache, on what one run showed (2026-11-17, #48). React Native documents
# ccache (https://reactnative.dev/docs/build-speed#local-caches), and with `USE_CCACHE=1` at
# `pod install` the Podfile does point every pod's clang at React Native's
# scripts/xcode/ccache-clang.sh, which runs `exec $CCACHE_BINARY clang "$@"`. But `CCACHE_BINARY`
# is an Xcode build setting, and Xcode doesn't give its build settings to the compiler's
# environment (react-native issue #46126), so the script ran clang directly: the run's 1,290
# compiles left ccache with 0 calls, 0 files and an empty folder. A cache that never fills only
# costs time and the repository's 10 GB of caches. The other caches were considered and left out:
# Pods and the generated project (`prebuild --clean` makes them anew, and `pod install` took about
# a minute), and DerivedData (a fresh checkout's new timestamps rebuild it, and its paths are
# absolute). Nothing built here ships: the job shows the app compiles, and a release doesn't build it.
#
# The runner's Xcode must be one Expo SDK 58 supports, so the image is macOS 26's
# (https://github.com/actions/runner-images). Each action is pinned to a full commit SHA, with its
# version beside it.
name: Native

# The heavy tier (ADR 0062, next-branch.md › CI by branch): it runs on a push to next, a pull
# request into main, and a pull request with the `full-ci` label. A push to main runs
# only ci.yml's fast tier (the owner's answer 3). A push to next runs it whatever it changed
# (2026-11-17): the next → main pull request reuses next's result only for its exact commit, so
# next needs one for every commit it may stand at.
#
# A pull request into next runs it without the label only when it touches the client's native
# side (the `changes` job below has the list, since 2026-11-19, HT-111). Before HT-111 any change to the client or the packages started the workflow, since the app reaches
# most packages through @highsea-tv/sdk and @highsea-tv/client. A break that a change
# elsewhere (the packages, the server, the client's screens) brings here is found on next after
# the merge, by the owner's choice (next-branch.md's 2026-11-19 section); `full-ci` runs it before.
#
# So the pull request trigger has no paths. A path filter is matched against the pull request's
# changed files for every activity type, `labeled` included, so with a narrow list adding
# `full-ci` to a pull request outside it would start nothing
# (https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#onpushpull_requestpull_request_targetpathspaths-ignore).
# It has no branch filter either, so a pull request into next with the label gets here, and
# `labeled` joins the default types so adding the label starts it
# (https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#pull_request).
# The jobs' `if:` holds the rest: a pull request into another branch without the label skips
# them, and a job its `if:` skips reports success rather than leaving a check pending
# (https://docs.github.com/en/pull-requests/how-tos/merge-and-close-pull-requests/troubleshooting-required-status-checks#handling-skipped-but-required-checks).
# None of them is a required check (the rulesets require ci.yml's jobs only). `github.base_ref` is
# the base branch, and `contains()` looks for the label among `github.event.pull_request.labels`'
# names (https://docs.github.com/en/actions/reference/workflows-and-actions/expressions#contains).
on:
  push:
    branches: [next]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

# A pull request's newer run cancels its older one, and since 2026-11-19 so does a push to next:
# the group is the branch's, so only next's newest commit keeps a run, and nothing reads a
# superseded commit's run (ci.yml's note on `concurrency`,
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#concurrency).
# Anything else, a release among them, is in a group of its own and never cancelled.
concurrency:
  group: native-${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/next')) && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/next') }}

permissions:
  contents: read

jobs:
  # What a pull request into next must touch to run Native without `full-ci`: the client's native
  # configuration (the Expo config, its plugins in packages/native/plugins, autolinking's
  # react-native.config.js, Metro's config, the client's manifest), the Swift module
  # (packages/native/ios and its expo-module.config.json and manifest), the generated project
  # should it ever be committed (apps/client/ios, which `expo prebuild` makes and git ignores
  # today), the lockfile (pods follow the installed native modules), the bundle check
  # (scripts/bundles.ts) and the licence audit over the pods (scripts/license-audit.ts), and this
  # file.
  # The files come from `git diff --name-only` between where the pull request branched and its
  # head (ci.yml's `changes` lists them the same way); a path filter can't be read in a job's
  # `if:`. Any other event, or another base branch, skips this job, and the heavy jobs' own
  # condition decides.
  changes:
    if: github.event_name == 'pull_request' && github.base_ref == 'next'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.files.outputs.run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Does it touch the native side?
        id: files
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          run=false
          while IFS= read -r file; do
            case "$file" in
              apps/client/app.config.ts | apps/client/package.json | apps/client/react-native.config.js \
                | apps/client/metro.config.js | apps/client/ios/* | packages/native/ios/* \
                | packages/native/plugins/* | packages/native/expo-module.config.json \
                | packages/native/package.json | scripts/bundles.ts | scripts/license-audit.ts | bun.lock \
                | .github/workflows/native.yml) run=true ;;
            esac
          done <<< "$(git diff --name-only --no-renames "$BASE...$HEAD")"
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ "$run" = true ]; then
            echo "::notice::It touches the native side, so the iOS and tvOS builds run"
          fi

  ios:
    needs: changes
    # The heavy tier's condition (the comment above `on:`), and a pull request into next that
    # touches what this workflow is about (`changes`). `changes` is skipped on every other event,
    # and a job whose `needs` was skipped is skipped too unless its `if:` has a status check
    # function, so `!cancelled()` keeps the rest running
    # (https://docs.github.com/en/actions/reference/workflows-and-actions/expressions#status-check-functions).
    if: &heavy >-
      !cancelled() && (
        (github.event_name == 'pull_request'
          && (github.base_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'full-ci')
            || needs.changes.outputs.run == 'true'))
        || (github.event_name == 'push' && github.ref == 'refs/heads/next')
        || (github.event_name != 'pull_request' && github.event_name != 'push'))
    runs-on: macos-26
    # Without a limit a job may run for 360 minutes, GitHub's default
    # (https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idtimeout-minutes);
    # the last 8 builds took 47 minutes on average, 58 at most, 20 of them the Jest tests it no
    # longer runs, and it may wait 30 for next's run first
    timeout-minutes: 90
    # `actions: read` for the reuse step (ci.yml's note on `playback`)
    permissions: &reuse-permissions
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # On the next → main pull request: passed on next for this commit? Then every step after
      # it is skipped and the job passes (.github/scripts/reuse-next.sh, ci.yml's header). The
      # arguments: this workflow's file, the job's check name, the minutes to wait.
      - name: Reuse next's result for this commit
        id: reuse
        if: &next-to-main github.event_name == 'pull_request' && github.base_ref == 'main'
        run: bash .github/scripts/reuse-next.sh native.yml ios 30
        env: &reuse-env
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          MERGE_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - if: &build steps.reuse.outputs.reused != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - if: *build
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - if: *build
        run: bun install --frozen-lockfile
      # the phone's bundle draws with ui's native renderer only, and no `.web` side (ADR 0060, 0061)
      - name: The bundle carries no web renderer
        if: *build
        run: bun scripts/bundles.ts client-phone
      # the generated project, with its pods installed (prebuild runs `pod install`)
      - name: The iOS project
        if: *build
        working-directory: apps/client
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: bun run prebuild
      - name: Licences, with the pods
        if: *build
        run: bun run licenses
      - name: The app, for the simulator
        if: *build
        working-directory: apps/client/ios
        run: |
          xcodebuild -workspace highsea.xcworkspace -scheme highsea -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO build

  tvos:
    needs: changes
    if: *heavy
    runs-on: macos-26
    # the last 8 builds took 30 minutes on average, 37 at most (the limit's note on ios), and it
    # may wait 20 for next's run first
    timeout-minutes: 60
    permissions: *reuse-permissions
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Reuse next's result for this commit
        id: reuse
        if: *next-to-main
        run: bash .github/scripts/reuse-next.sh native.yml tvos 20
        env: *reuse-env
      - if: *build
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - if: *build
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - if: *build
        run: bun install --frozen-lockfile
      # the TV's bundle draws with ui's native renderer only, and no `.web` side (ADR 0060, 0061)
      - name: The bundle carries no web renderer
        if: *build
        run: bun scripts/bundles.ts client-tv
      - name: The tvOS project
        if: *build
        working-directory: apps/client
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: bun run prebuild:tv
      - name: Licences, with the pods
        if: *build
        run: bun run licenses
      - name: The app, for the simulator
        if: *build
        working-directory: apps/client/ios
        run: |
          xcodebuild -workspace highsea.xcworkspace -scheme highsea -configuration Release \
            -sdk appletvsimulator -destination 'generic/platform=tvOS Simulator' \
            -derivedDataPath build CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO build
