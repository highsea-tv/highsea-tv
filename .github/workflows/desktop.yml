# SPDX-License-Identifier: AGPL-3.0-only
# The desktop app (ADR 0058; phase-4-checkpoint-4.md › Signed installers and updates): in the
# heavy tier (below), on the changes that could reach it, the Rust side's format, lints and tests
# on all three systems, then the app built and bundled on each, as Tauri's pipeline guide builds it
# (https://v2.tauri.app/distribute/pipelines/github/). Nothing is signed or uploaded here; the
# release workflow builds, signs and attaches the installers in the `release` environment.
#
# Rust is the one in apps/desktop/src-tauri/rust-toolchain.toml, which rustup installs on GitHub's
# images when cargo first runs there (https://rust-lang.github.io/rustup/overrides.html). Each
# action is pinned to a full commit SHA, with its version beside it.
name: Desktop

# The heavy tier (ADR 0062, next-branch.md › CI by branch): it runs on a push to next, a pull
# request into main, and a pull request with the `full-ci` label. The pull request trigger has no
# branch filter, so a pull request into next with the label gets here, and `labeled` joins the
# default types so adding the label starts it
# (https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#pull_request).
# A push to main runs only ci.yml's `check` (the owner's answer 3). The jobs' `if:` holds the rest:
# a pull request into another branch without the label skips them, and a job its `if:` skips
# reports success rather than leaving a check pending
# (https://docs.github.com/en/pull-requests/how-tos/merge-and-close-pull-requests/troubleshooting-required-status-checks#handling-skipped-but-required-checks).
# `github.base_ref` is the base branch, and `contains()` looks for the label among
# `github.event.pull_request.labels`' names
# (https://docs.github.com/en/actions/reference/workflows-and-actions/expressions#contains).
on:
  push:
    branches: [next]
    paths:
      - 'apps/desktop/**'
      - 'apps/client/**'
      - 'packages/**'
      - 'bun.lock'
      - '.github/workflows/desktop.yml'
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'apps/desktop/**'
      - 'apps/client/**'
      - 'packages/**'
      - 'bun.lock'
      - '.github/workflows/desktop.yml'

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # the heavy tier's condition (the comment above `on:`)
    if: >-
      (github.event_name == 'pull_request'
        && (github.base_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'full-ci')))
      || (github.event_name == 'push' && github.ref == 'refs/heads/next')
      || (github.event_name != 'pull_request' && github.event_name != 'push')
    strategy:
      fail-fast: false
      matrix:
        include:
          # one universal app for Apple silicon and Intel Macs
          - runner: macos-15
            target: universal-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      # Tauri's Linux prerequisites (https://v2.tauri.app/start/prerequisites/#linux), and D-Bus for
      # the Secret Service the keychain uses there
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential \
            file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev
      - name: Rust, and both Mac targets
        working-directory: apps/desktop/src-tauri
        run: |
          rustup show active-toolchain || rustup toolchain install
          if [ "$RUNNER_OS" = macOS ]; then rustup target add aarch64-apple-darwin x86_64-apple-darwin; fi
      # the registry and the build, kept between runs by the lockfile
      # (https://doc.rust-lang.org/cargo/guide/cargo-home.html#caching-the-cargo-home-in-ci)
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/desktop/src-tauri/target/
          key: cargo-${{ matrix.target }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ matrix.target }}-
      - run: bun install --frozen-lockfile
      # the page's checks run in CI's main job; here, what only the Rust side has
      - name: Format, lints and tests
        working-directory: apps/desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      # unsigned, without the updater's artifacts: the release builds those with its key
      - name: The app and its installers
        working-directory: apps/desktop
        run: bun run tauri build --ci --target ${{ matrix.target }} -- --locked
        # Tauri runs the client's desktop export first (tauri.conf.json's beforeBuildCommand)
        env:
          EXPO_NO_TELEMETRY: 1
