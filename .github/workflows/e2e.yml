# SPDX-License-Identifier: AGPL-3.0-only
# The end-to-end run through the container (phase-3-checkpoint-9.md › Tests (9a)): the production
# image beside the fixtures service on a network with no way out (compose.e2e.yaml), driven by
# Playwright through setup, a one-click indexer, adding and grabbing Sintel, Activity, the import,
# the synced subtitle, a theme and a layout across sessions, and an announcement for Admins.
# In the heavy tier, when a change touches the server, amd64 only; arm64 boots healthy in ci.yml.
name: End to end

# The heavy tier (ADR 0062, next-branch.md › CI by branch): it runs on a push to next, a pull
# request into main, a pull request with the `full-ci` label, and a release (release.yml calls it; a called
# workflow's `github` context is its caller's, whose event is workflow_dispatch). The pull request trigger has no
# branch filter, so a pull request into next with the label gets here, and `labeled` joins the
# default types so adding the label starts it
# (https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#pull_request).
# A push to main runs only ci.yml's `check` (the owner's answer 3). The jobs' `if:` holds the rest:
# a pull request into another branch without the label skips them, and a job its `if:` skips
# reports success rather than leaving a check pending
# (https://docs.github.com/en/pull-requests/how-tos/merge-and-close-pull-requests/troubleshooting-required-status-checks#handling-skipped-but-required-checks).
# `github.base_ref` is the base branch, and `contains()` looks for the label among
# `github.event.pull_request.labels`' names
# (https://docs.github.com/en/actions/reference/workflows-and-actions/expressions#contains).
on:
  push:
    branches: [next]
    paths:
      - 'apps/server/**'
      - 'packages/**'
      - 'catalog/**'
      - 'docker/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'compose.e2e.yaml'
      - 'scripts/e2e/**'
      - 'scripts/image.ts'
      - 'package.json'
      - 'bun.lock'
      - '.nvmrc'
      - '.github/workflows/e2e.yml'
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'apps/server/**'
      - 'packages/**'
      - 'catalog/**'
      - 'docker/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'compose.e2e.yaml'
      - 'scripts/e2e/**'
      - 'scripts/image.ts'
      - 'package.json'
      - 'bun.lock'
      - '.nvmrc'
      - '.github/workflows/e2e.yml'
  # the release runs it before building anything (release.yml)
  workflow_call:

# a called workflow's `github` context is its caller's, so `github.workflow` keeps a release's run apart
# from a push's, and neither cancels the other
# (https://docs.github.com/en/actions/reference/workflows-and-actions/reusing-workflow-configurations)
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    # the heavy tier's condition (the comment above `on:`)
    if: >-
      (github.event_name == 'pull_request'
        && (github.base_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'full-ci')))
      || (github.event_name == 'push' && github.ref == 'refs/heads/next')
      || (github.event_name != 'pull_request' && github.event_name != 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Chromium for Playwright
        run: bunx playwright-core install --with-deps chromium
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      # from ci.yml's amd64 cache when it's there
      - name: Build the image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          load: true
          provenance: false
          tags: highsea:ci
          cache-from: type=gha,scope=image-linux/amd64
      - name: Build the fixtures
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: e2e-fixtures
          platforms: linux/amd64
          load: true
          provenance: false
          tags: highsea-e2e-fixtures
          cache-from: |
            type=gha,scope=image-linux/amd64
            type=gha,scope=e2e-fixtures
          cache-to: type=gha,scope=e2e-fixtures,mode=max
      - name: The run
        run: bun scripts/e2e/run.ts
        env:
          HIGHSEA_IMAGE: highsea:ci
          E2E_ARTIFACTS: ${{ runner.temp }}/e2e
      - name: Screenshots and logs, when it fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e
          path: ${{ runner.temp }}/e2e
