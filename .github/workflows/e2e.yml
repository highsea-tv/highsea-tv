# SPDX-License-Identifier: AGPL-3.0-only
# The end-to-end run through the container (phase-3-checkpoint-9.md › Tests (9a)): the production
# image beside the fixtures service on a network with no way out (scripts/e2e/compose.yaml), driven by
# Playwright through setup, a one-click indexer, adding and grabbing Sintel, Activity, the import,
# the synced subtitle, a theme and a layout across sessions, and an announcement for Admins.
# In the heavy tier (on a pull request into next, when it touches the image or the run's own
# stack), amd64 only; arm64 boots healthy in ci.yml.
name: End to end

# The heavy tier (ADR 0062, next-branch.md › CI by branch): it runs on a push to next, a pull
# request into main, a pull request with the `full-ci` label, and a release (release.yml calls it;
# a called workflow's `github` context is its caller's, whose event is workflow_dispatch). A push to main runs only
# ci.yml's fast tier (the owner's answer 3). A push to next runs it whatever it changed
# (2026-11-17): the next → main pull request reuses next's result only for its exact commit, so
# next needs one for every commit it may stand at.
#
# A pull request into next runs it without the label only when it touches what the image and
# this run are built from (the `changes` job below has the list, since 2026-11-19, HT-111).
# Since HT-97 that
# included the catalog and the fixtures, after #95 broke the fixtures' catalog unseen; before
# HT-111 any change to the server or the packages started the workflow. A break that a change
# elsewhere (the packages, the server, the client's screens) brings here is found on next after
# the merge, by the owner's choice (next-branch.md's 2026-11-19 section); `full-ci` runs it before.
#
# So the pull request trigger has no paths. A path filter is matched against the pull request's
# changed files for every activity type, `labeled` included, so with a narrow list adding
# `full-ci` to a pull request outside it would start nothing
# (https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#onpushpull_requestpull_request_targetpathspaths-ignore).
# It has no branch filter either, so a pull request into next with the label gets here, and
# `labeled` joins the default types so adding the label starts it
# (https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#pull_request).
# The jobs' `if:` holds the rest: a pull request into another branch without the label skips
# them, and a job its `if:` skips reports success rather than leaving a check pending
# (https://docs.github.com/en/pull-requests/how-tos/merge-and-close-pull-requests/troubleshooting-required-status-checks#handling-skipped-but-required-checks).
# None of them is a required check (the rulesets require ci.yml's jobs only). `github.base_ref` is
# the base branch, and `contains()` looks for the label among `github.event.pull_request.labels`'
# names (https://docs.github.com/en/actions/reference/workflows-and-actions/expressions#contains).
on:
  push:
    branches: [next]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  # the release runs it before building anything (release.yml)
  workflow_call:

# A pull request's newer run cancels its older one, and since 2026-11-19 so does a push to next:
# the group is the branch's, so only next's newest commit keeps a run, and nothing reads a
# superseded commit's run (ci.yml's note on `concurrency`,
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#concurrency).
# Anything else, a release among them, is in a group of its own and never cancelled.
concurrency:
  group: e2e-${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/next')) && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/next') }}

permissions:
  contents: read

jobs:
  # What a pull request into next must touch to run End to end without `full-ci`: the image's
  # build (the Dockerfile, its ignore list, docker/, scripts/image.ts, Node's version, the root
  # manifest and the lockfile), the run itself (scripts/e2e/) and the fixtures' catalog
  # (catalog/, packages/catalog/, HT-97), and this file.
  # The files come from `git diff --name-only` between where the pull request branched and its
  # head (ci.yml's `changes` lists them the same way); a path filter can't be read in a job's
  # `if:`. Any other event, or another base branch, skips this job, and the heavy jobs' own
  # condition decides.
  changes:
    if: github.event_name == 'pull_request' && github.base_ref == 'next'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.files.outputs.run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Does it touch the image or the run's own stack?
        id: files
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          run=false
          while IFS= read -r file; do
            case "$file" in
              Dockerfile | .dockerignore | .nvmrc | package.json | bun.lock | docker/* \
                | scripts/e2e/* | scripts/image.ts | catalog/* | packages/catalog/* \
                | .github/workflows/e2e.yml) run=true ;;
            esac
          done <<< "$(git diff --name-only --no-renames "$BASE...$HEAD")"
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ "$run" = true ]; then
            echo "::notice::It touches the image or the run's own stack, so the end-to-end run runs"
          fi

  e2e:
    # The heavy tier's condition (the comment above `on:`), and a pull request into next that
    # touches what this workflow is about (`changes`). `changes` is skipped on every other event,
    # and a job whose `needs` was skipped is skipped too unless its `if:` has a status check
    # function, so `!cancelled()` keeps the rest running
    # (https://docs.github.com/en/actions/reference/workflows-and-actions/expressions#status-check-functions).
    needs: changes
    if: >-
      !cancelled() && (
        (github.event_name == 'pull_request'
          && (github.base_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'full-ci')
            || needs.changes.outputs.run == 'true'))
        || (github.event_name == 'push' && github.ref == 'refs/heads/next')
        || (github.event_name != 'pull_request' && github.event_name != 'push'))
    runs-on: ubuntu-24.04
    # its runs took 10 to 13 minutes, and it may wait 15 for next's run first
    timeout-minutes: 30
    # `actions: read` for the reuse step (ci.yml's note on `playback`)
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # On the next → main pull request: passed on next for this commit? Then every step after
      # it is skipped and the job passes (.github/scripts/reuse-next.sh, ci.yml's header)
      - name: Reuse next's result for this commit
        id: reuse
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: bash .github/scripts/reuse-next.sh e2e.yml e2e 15
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          MERGE_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - if: &build steps.reuse.outputs.reused != 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - if: *build
        run: bun install --frozen-lockfile
      # Chromium's system packages through the shared apt steps, which try another mirror when one
      # is slow (.github/scripts/apt.sh), rather than `--with-deps`, whose apt-get has no limit of
      # its own: the ones Playwright reports missing (`install-deps --dry-run`, as ci.yml's
      # `playback` lists them). The browser's download retries itself
      # (playwright-core's registry/browserFetcher.ts); the limit is for a stall.
      - if: *build
        name: Chromium's system packages
        timeout-minutes: 12
        run: |
          bash .github/scripts/apt.sh update
          packages=$(bunx playwright-core install-deps --dry-run chromium | sed -n 's/^  \([^ ]*\)$/\1/p' | tr '\n' ' ' || true)
          echo "Playwright's packages: ${packages:-none missing}"
          # shellcheck disable=SC2086 # one word per package
          if [ -n "$packages" ]; then bash .github/scripts/apt.sh install $packages; fi
      - if: *build
        name: Chromium for Playwright
        timeout-minutes: 5
        run: bunx playwright-core install chromium
      - if: *build
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      # from ci.yml's amd64 cache when it's there
      - if: *build
        name: Build the image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          load: true
          provenance: false
          tags: highsea:ci
          cache-from: type=gha,scope=image-linux/amd64
      - if: *build
        name: Build the fixtures
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: e2e-fixtures
          platforms: linux/amd64
          load: true
          provenance: false
          tags: highsea-e2e-fixtures
          cache-from: |
            type=gha,scope=image-linux/amd64
            type=gha,scope=e2e-fixtures
          cache-to: type=gha,scope=e2e-fixtures,mode=max
      - if: *build
        name: The run
        run: bun scripts/e2e/run.ts
        env:
          HIGHSEA_IMAGE: highsea:ci
          E2E_ARTIFACTS: ${{ runner.temp }}/e2e
      - name: Screenshots and logs, when it fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e
          path: ${{ runner.temp }}/e2e
