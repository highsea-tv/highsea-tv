# SPDX-License-Identifier: AGPL-3.0-only
# A highsea release (ADR 0050), run by hand. While highsea is pre-production it's one click from
# next (ADR 0050's 2026-11-17 section): Run workflow on next, leave the version blank, approve the
# `release` environment once, and the workflow prepares, checks, builds, publishes and lands it.
#
#   1. prepare: the version is picked (blank: the next patch after the newest tag, or a newer one
#      already prepared; `minor`, `major` or an explicit SemVer newer than every tag), then
#      `release.ts prepare` writes it with today's date, unless the commit is already prepared.
#      An empty Unreleased is filled from the pull requests merged since the last tag; one written
#      by hand wins. The bumped tree's own checks run (bun.lock, lint of what changed, the tests
#      that read the version files, `release.ts check`), and the result becomes one release
#      commit: on next, its parents are next's commit and, when main isn't already its ancestor,
#      main's, so both branches can fast-forward to it. From main nothing is written: a real
#      release there must be prepared in a commit first, as before.
#   2. checks: the whole of CI and the end-to-end run, as reusable workflows from this commit. A
#      release from next reuses next's own push runs of both for the same commit when they passed
#      (.github/scripts/reuse-release.sh); the bump only changes versions and notes, which the
#      checks in 1 and the builds below cover. `checks` passes only when each part passed or was
#      reused, and every keyed job waits on it, so they all ask for the `release` environment at
#      the same moment and one approval lets them all go.
#   3. image: each platform on its own runner, with highsea's keys as build secrets, labels,
#      provenance and an SBOM. A dry run keeps each as an OCI layout and uploads it; a real one also
#      pushes it by digest, the way Docker's GitHub Builder distributes a build
#      (https://docs.docker.com/build/ci/github-actions/multi-platform/,
#      https://docs.docker.com/build/exporters/image-registry/).
#   4. catalog: built and signed with the release key, with the release's entry in it.
#   5. spk: the Synology package for a stable release (scripts/spk.ts), which runs this release's
#      image as a Container Manager project; a dry run uploads it for review.
#   6. desktop: the desktop app for a stable release (ADR 0058), built on macOS, Windows and Linux
#      and signed for the updater with TAURI_SIGNING_PRIVATE_KEY (a dry run without it signs with
#      the development key), then `latest.json` and the installers' SHA-256 sums from them.
#   7. publishable: every build ended as the release needs (scripts/release-gate.ts). Nothing
#      below runs until it has passed, so a build that failed, was cancelled or never got a runner
#      leaves nothing published (ADR 0050's second 2026-11-18 note).
#   8. publish, only when it isn't a dry run, in order of how hard each is to take back: the
#      platforms merged under their tags (`docker buildx imagetools create`), the catalog deployed
#      to GitHub Pages, and last `github-release`: the tag on the release commit, the GitHub
#      release with the changelog's section, the Synology package and the desktop app's
#      installers and feed, and, from next, next and main fast-forwarded to the release commit,
#      which deploys docs.highsea.tv. The note above `merge` says what a failure at each leaves.
#
# Jobs that read highsea's keys, the catalog key or the deploy key use the `release` environment,
# whose required reviewer is the owner, so nothing signed, keyed or pushed runs without their
# approval; its secrets reach only jobs that name it, and only from the branches its policy allows
# (https://docs.github.com/en/actions/how-tos/deploy/configure-and-manage-deployments/manage-environments).
# Each action is pinned to a full commit SHA, with its version beside it.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Blank for the next patch, or minor, major, or a SemVer version (0.5.0, 0.6.0-beta.1)
        required: false
        type: string
        default: ''
      dry-run:
        description: Build and check everything, and publish nothing
        required: true
        type: boolean
        default: false

# The release's runners come from the same pool as CI's, and GitHub has no priority among queued
# jobs or workflows: a job waits for a free runner of its label, and GitHub Free runs at most 5
# macOS jobs at once across the account (https://docs.github.com/en/actions/reference/limits).
# Nothing here can be ordered or grouped to jump that queue: `concurrency` only cancels or holds
# runs in the same group, never another workflow's. What keeps the macOS job's wait short is
# CI's own concurrency since 2026-11-19 (ci.yml's note): a push to next cancels next's older runs,
# so at most one Native run (ios and tvos) and one Desktop run (one macOS job) hold macOS runners,
# leaving the release's `desktop (macos-15)` room. On 2026-11-19, before it, four Native runs held
# them, and the 0.4.7 release waited 27 minutes for one.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/highsea-tv/highsea

jobs:
  prepare:
    runs-on: ubuntu-24.04
    # under a minute in the last six releases (2026-11-18 and 19)
    timeout-minutes: 15
    permissions:
      contents: read
      # the merged pull requests' labels, for the changelog
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.commit.outputs.commit }}
      bundle: ${{ steps.commit.outputs.bundle }}
      tags: ${{ steps.tags.outputs.tags }}
      prerelease: ${{ steps.tags.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # every branch and tag, so the version is checked against the tags, the changelog reads
          # the commits since the newest, and main's commit is there for the release commit
          # (https://github.com/actions/checkout#fetch-all-history-for-all-tags-and-branches)
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: A real release comes from next or main
        if: ${{ !inputs.dry-run && github.ref != 'refs/heads/next' && github.ref != 'refs/heads/main' }}
        run: |
          echo "A release is published from next or main, not ${GITHUB_REF}. A dry run can come from any branch." >&2
          exit 1
      - name: The version
        id: version
        run: |
          version=$(bun scripts/release.ts version "$WANTED")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "Releasing $version (asked for: ${WANTED:-the next patch})"
        env:
          WANTED: ${{ inputs.version }}
      - name: Prepare it, unless the commit already is
        run: |
          if bun scripts/release.ts check "$VERSION"; then
            echo "This commit is already prepared for $VERSION; it's released as it is."
            echo "NOTES_FROM=the changelog as prepared in the commit" >> "$GITHUB_ENV"
          elif [ "$GITHUB_REF" = refs/heads/main ] && [ "$DRY_RUN" != true ]; then
            echo "From main a release must be prepared in a commit first (bun scripts/release.ts prepare $VERSION); from next the workflow prepares it." >&2
            exit 1
          else
            bun scripts/release.ts merged > "$RUNNER_TEMP/merged.json"
            from=$(bun scripts/release.ts changelog "$RUNNER_TEMP/merged.json")
            echo "$from"
            case "$from" in *hand*) echo "NOTES_FROM=Unreleased, written by hand" ;; *) echo "NOTES_FROM=the pull requests merged since the last tag" ;; esac >> "$GITHUB_ENV"
            bun scripts/release.ts prepare "$VERSION" --date "$(date -u +%Y-%m-%d)"
          fi
          git status --short
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry-run }}
      # The bump changes versions, notes, the seed, openapi.json and bun.lock, and CI's run was of
      # the commit before it, so what reads those files runs again here on the bumped tree: the
      # lockfile agrees with the workspaces, what prepare wrote is formatted, the API description
      # and the seed are current, and the release agrees with itself and the tags
      - name: The bumped tree still passes what the bump touches
        run: |
          bun install --frozen-lockfile
          git diff --name-only -z --diff-filter=d HEAD | xargs -0 -r bunx biome check --no-errors-on-unmatched
          bun test --isolate apps/server/test/api.test.ts packages/catalog/test/signing.test.ts \
            scripts/release.test.ts
          bun scripts/release.ts check "$VERSION"
      # One commit for the release. From next, its first parent is the commit the run started
      # from, and when main isn't its ancestor yet (each merge of next into main left a merge
      # commit on main alone), main's commit is its second parent, so next and main both
      # fast-forward to it after publishing. That's only right when main holds nothing next lacks:
      # merging main into this commit must give this commit's own tree (git-merge-tree(1)
      # --write-tree), or the release stops. From main, the commit is main's own.
      - name: The release commit
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            echo "commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "bundle=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add -A
          tree=$(git write-tree)
          parents=(-p "$GITHUB_SHA")
          main=$(git rev-parse origin/main)
          if ! git merge-base --is-ancestor "$main" "$GITHUB_SHA"; then
            merged=$(git merge-tree --write-tree "$GITHUB_SHA" "$main") \
              || { echo "main and $GITHUB_REF_NAME conflict; merge main into next first." >&2; exit 1; }
            if [ "$merged" != "$(git rev-parse "$GITHUB_SHA^{tree}")" ]; then
              echo "main has changes $GITHUB_REF_NAME lacks, so it can't fast-forward to the release; merge main into next first." >&2
              exit 1
            fi
            parents+=(-p "$main")
          fi
          if [ "$tree" = "$(git rev-parse "$GITHUB_SHA^{tree}")" ] && [ "${#parents[@]}" -eq 2 ]; then
            echo "commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "bundle=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          commit=$(git commit-tree "$tree" "${parents[@]}" -F - <<MSG
          Release $VERSION, dated $(date -u +%Y-%m-%d)

          - The changelog's $VERSION section, from $NOTES_FROM
          - The versions, the catalog's releases.json and CHANGES.md, the seed, openapi.json and
            bun.lock, written by scripts/release.ts prepare
          - Made by the Release workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          MSG
          )
          git branch release-commit "$commit"
          git bundle create "$RUNNER_TEMP/release.bundle" release-commit "^$GITHUB_SHA" "^$main"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "bundle=true" >> "$GITHUB_OUTPUT"
          git log -1 --format='%H%n%P%n%n%B' "$commit"
          git diff --stat "$GITHUB_SHA" "$commit"
      - name: Tags and notes
        id: tags
        run: |
          {
            echo 'tags<<EOF'
            bun scripts/release.ts tags "$VERSION"
            echo 'EOF'
            case "$VERSION" in *-*) echo 'prerelease=true' ;; *) echo 'prerelease=false' ;; esac
          } >> "$GITHUB_OUTPUT"
          {
            echo "## highsea $VERSION"
            echo
            echo "Image tags: $(bun scripts/release.ts tags "$VERSION" | paste -sd ' ')"
            echo
            echo "Notes from: ${NOTES_FROM}"
            echo
            echo "Release commit: \`$COMMIT\` on \`$GITHUB_SHA\`"
            echo
            bun scripts/release.ts notes "$VERSION"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          COMMIT: ${{ steps.commit.outputs.commit }}
      # what prepare wrote, at its paths, so the image, the catalog and the desktop app build from
      # it; the bundle carries the commit itself to github-release
      - name: The prepared files
        run: |
          mkdir -p "$RUNNER_TEMP/release-files"
          # the changelog always, so the artifact is never empty when the commit was prepared already
          cp --parents CHANGELOG.md "$RUNNER_TEMP/release-files/"
          git diff --name-only -z --diff-filter=d "$GITHUB_SHA" | xargs -0 -r cp --parents -t "$RUNNER_TEMP/release-files/"
          (cd "$RUNNER_TEMP/release-files" && find . -type f | sort | head -50)
          bun scripts/release.ts notes "$VERSION" > "$RUNNER_TEMP/release-notes.md"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-files
          path: ${{ runner.temp }}/release-files/
          include-hidden-files: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
      - if: ${{ steps.commit.outputs.bundle == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-bundle
          path: ${{ runner.temp }}/release.bundle

  # Whether next already ran CI and the end-to-end run for this commit and passed. Their push runs
  # on next are of exactly this SHA and so of this tree and these workflow files, and the bump on
  # top changes only versions and notes, which prepare's own checks and the builds below cover
  # (ADR 0050's 2026-11-17 section). Reading other runs needs `actions: read`
  # (https://docs.github.com/en/rest/actions/workflow-runs).
  reuse:
    runs-on: ubuntu-24.04
    # up to 13 minutes in the last six releases (2026-11-18 and 19), and it may wait 45 for each of
    # next's two runs
    timeout-minutes: 100
    permissions:
      contents: read
      actions: read
    outputs:
      ci: ${{ steps.ci.outputs.reused }}
      e2e: ${{ steps.e2e.outputs.reused }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: ci
        run: bash .github/scripts/reuse-release.sh ci.yml 45
        env: &reuse-env
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
      - id: e2e
        run: bash .github/scripts/reuse-release.sh e2e.yml 45
        env: *reuse-env

  # The heavy jobs in ci.yml and e2e.yml read next's runs to reuse a result on the next → main pull
  # request, which needs `actions: read`; a called workflow can only lower the permissions its
  # caller gives, so they're given here
  # (https://docs.github.com/en/actions/reference/workflows-and-actions/reusing-workflow-configurations).
  # A release's event isn't a pull request, so inside them nothing is reused; the release skips a
  # whole call instead when `reuse` found next's run of it passed. A job skipped by its `if:`
  # reports success, which is why `checks` below looks at `reuse` too.
  ci:
    needs: [prepare, reuse]
    if: ${{ needs.reuse.outputs.ci != 'true' }}
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      actions: read

  e2e:
    needs: [prepare, reuse]
    if: ${{ needs.reuse.outputs.e2e != 'true' }}
    uses: ./.github/workflows/e2e.yml
    permissions:
      contents: read
      actions: read

  # Every check, passed or reused; the keyed jobs wait on this one alone, so they reach the
  # `release` environment together and one approval covers them (GitHub asks for each job as it
  # reaches the environment). It runs whatever the others did (`!cancelled()`) and fails unless
  # each result is right: a job whose `needs` failed is skipped, and a skipped job counts as
  # passing (https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#needs-context,
  # https://docs.github.com/en/actions/reference/workflows-and-actions/expressions#status-check-functions).
  checks:
    if: ${{ !cancelled() }}
    needs: [prepare, reuse, ci, e2e, spk]
    runs-on: ubuntu-24.04
    # seconds in the last six releases (2026-11-18 and 19)
    timeout-minutes: 5
    steps:
      - name: Every check passed, or passed on next for this commit
        run: |
          ok=true
          check() { if [ "$2" = success ] || { [ "$2" = skipped ] && [ "$3" = true ]; }; then echo "$1: $2"; else echo "$1: $2" >&2; ok=false; fi; }
          check prepare "$PREPARE" false
          check ci "$CI" "$CI_REUSED"
          check e2e "$E2E" "$E2E_REUSED"
          check spk "$SPK" "$PRERELEASE"
          $ok
        env:
          PREPARE: ${{ needs.prepare.result }}
          CI: ${{ needs.ci.result }}
          CI_REUSED: ${{ needs.reuse.outputs.ci }}
          E2E: ${{ needs.e2e.result }}
          E2E_REUSED: ${{ needs.reuse.outputs.e2e }}
          SPK: ${{ needs.spk.result }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}

  # Every job from here on names the results it needs and runs on `!cancelled()`. Without a status
  # function an `if:` is `success() && …`, and GitHub skips a job when any job before it in its
  # `needs` chain failed or was skipped: "a failure or skip applies to all jobs in the dependency
  # chain from the point of failure or skip onwards"
  # (https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idneeds,
  # https://docs.github.com/en/actions/reference/workflows-and-actions/expressions#status-check-functions).
  # `ci` and `e2e` are skipped on purpose when next's results are reused, and they're in the chain
  # through `checks`, so run 44267473765 (2026-11-18) skipped every build and only `github-release`,
  # which had `!cancelled()`, went on (ADR 0050's 2026-11-18 note). `!cancelled()` still stops on a
  # cancel, and `needs.<job>.result == 'success'` keeps a failure upstream from going on.
  # scripts/release-gate.test.ts holds every job after `checks` to this.
  image:
    needs: [prepare, checks]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.checks.result == 'success' }}
    environment: release
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            name: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            name: arm64
    runs-on: ${{ matrix.runner }}
    # 6 minutes at most in the last six releases (2026-11-18 and 19); ci.yml's `image` has 30
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-files
          path: ${{ github.workspace }}
      - name: highsea's keys are there
        run: |
          if [ -z "$OPENSUBTITLES" ] || [ -z "$TRAKT_ID" ] || [ -z "$TMDB" ]; then
            if [ "$DRY_RUN" = true ]; then
              echo "::warning::The release environment lacks the OpenSubtitles.com key, the Trakt Client ID or the TMDB token; a real release would stop here."
            else
              echo "The release environment needs HIGHSEA_OPENSUBTITLES_KEY, HIGHSEA_TRAKT_CLIENT_ID and HIGHSEA_TMDB_READ_TOKEN." >&2
              exit 1
            fi
          fi
          # fanart.tv's project key is optional (ADR 0070): without it, fanart.tv is off until an
          # owner adds a personal key
          if [ -z "$FANART" ]; then
            echo "::warning::The release environment has no HIGHSEA_FANART_KEY; fanart.tv will be off unless an owner adds a personal key."
          fi
        env:
          OPENSUBTITLES: ${{ secrets.HIGHSEA_OPENSUBTITLES_KEY }}
          TRAKT_ID: ${{ secrets.HIGHSEA_TRAKT_CLIENT_ID }}
          TMDB: ${{ secrets.HIGHSEA_TMDB_READ_TOKEN }}
          FANART: ${{ secrets.HIGHSEA_FANART_KEY }}
          DRY_RUN: ${{ inputs.dry-run }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # the image's seed signed with the release key, which production servers trust (ADR 0034);
      # a dry run without the key signs it with the development key, as the repository's is
      - name: The seed, signed for the release
        run: bun scripts/catalog.ts build --seed
        env:
          HIGHSEA_CATALOG_KEY: ${{ secrets.HIGHSEA_CATALOG_KEY }}
          HIGHSEA_CATALOG_KEY_ID: ${{ secrets.HIGHSEA_CATALOG_KEY_ID }}
          HIGHSEA_CATALOG_SEED_RELEASE: '1'
      - name: Production servers will trust it
        run: bun scripts/release.ts trust || { [ "$DRY_RUN" = true ] && echo "::warning::A real release would stop here."; }
        env:
          HIGHSEA_CATALOG_KEY_ID: ${{ secrets.HIGHSEA_CATALOG_KEY_ID }}
          DRY_RUN: ${{ inputs.dry-run }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Sign in to GHCR
        if: ${{ !inputs.dry-run }}
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Labels
        id: meta
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: VERSION=${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.commit }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
          # BuildKit leaves a secret's contents out of the cache key, so a cached layer from CI,
          # built without the keys, would be reused here; a release builds without the cache
          # (https://docs.docker.com/build/building/secrets/)
          no-cache: true
          secrets: |
            opensubtitles=${{ secrets.HIGHSEA_OPENSUBTITLES_KEY }}
            trakt_id=${{ secrets.HIGHSEA_TRAKT_CLIENT_ID }}
            trakt_secret=${{ secrets.HIGHSEA_TRAKT_CLIENT_SECRET }}
            tmdb=${{ secrets.HIGHSEA_TMDB_READ_TOKEN }}
            fanart=${{ secrets.HIGHSEA_FANART_KEY }}
          provenance: mode=min
          sbom: true
          # A dry run writes an OCI layout to check and keep; a real release pushes by digest, as
          # Docker's multi-platform guide does, and nothing else. Both at once leave the layout's
          # index.json naming the pushed manifest list, whose attestation manifest differs from the
          # layout's and isn't in it (buildx 0.37.2, seen in 0.1.0's first run and again locally)
          outputs: ${{ inputs.dry-run && format('type=oci,dest={0}/highsea-oci,tar=false', runner.temp) || format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) }}
      - name: Labels and attestations are there
        if: ${{ inputs.dry-run }}
        run: bun scripts/image.ts attestations "$RUNNER_TEMP/highsea-oci"
      # what was pushed, read back from GHCR
      - name: Labels and attestations are there, in GHCR
        if: ${{ !inputs.dry-run }}
        run: bun scripts/image.ts published "$IMAGE@$DIGEST"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - name: The digest, for the merge
        if: ${{ !inputs.dry-run }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - if: ${{ !inputs.dry-run }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digest-${{ matrix.name }}
          path: ${{ runner.temp }}/digests/*
      - name: The image, for a dry run's review
        if: ${{ inputs.dry-run }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-${{ matrix.name }}
          path: ${{ runner.temp }}/highsea-oci
          retention-days: 7

  catalog:
    needs: [prepare, checks]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.checks.result == 'success' }}
    runs-on: ubuntu-24.04
    # under a minute in the last six releases (2026-11-18 and 19)
    timeout-minutes: 10
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-files
          path: ${{ github.workspace }}
      # the same steps as a catalog-only publish (catalog-release.yml, ADR 0069)
      - uses: ./.github/actions/catalog
        with:
          catalog-key: ${{ secrets.HIGHSEA_CATALOG_KEY }}
          catalog-key-id: ${{ secrets.HIGHSEA_CATALOG_KEY_ID }}
          dry-run: ${{ inputs.dry-run }}

  # DSM's versions have no place for a prerelease, so only a stable release gets a package
  # (https://help.synology.com/developer-guide/synology_package/INFO_necessary_fields.html)
  spk:
    if: ${{ needs.prepare.outputs.prerelease == 'false' }}
    needs: prepare
    runs-on: ubuntu-24.04
    # under a minute in the last six releases (2026-11-18 and 19)
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # the commit's time, so the same commit makes the same package
      # (https://reproducible-builds.org/specs/source-date-epoch/)
      - name: The package
        run: SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" bun scripts/spk.ts build "$VERSION" --out dist/spk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: spk
          path: dist/spk/

  # the desktop app on each stable release (ADR 0050's 4.4 section), as Tauri's pipeline guide
  # builds it (https://v2.tauri.app/distribute/pipelines/github/), with the updater's artifacts
  # signed (https://v2.tauri.app/plugin/updater/#building). The Mac app is signed and notarized
  # once the Apple secrets are there (https://v2.tauri.app/distribute/sign/macos/); Windows'
  # installer stays unsigned until 1.0 (the owner's answer of 2026-10-29)
  desktop:
    if: >-
      ${{ !cancelled() && needs.prepare.result == 'success' && needs.checks.result == 'success'
        && needs.prepare.outputs.prerelease == 'false' }}
    needs: [prepare, checks]
    environment: release
    strategy:
      matrix:
        include:
          - runner: macos-15
            target: universal-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    # up to 21 minutes on Linux and 16 on macOS in the last six releases (2026-11-18 and 19), and
    # its apt step is bounded at 15
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-files
          path: ${{ github.workspace }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # as desktop.yml installs them, through the shared apt steps (.github/scripts/apt.sh): the
      # 0.4.7 release's run spent 28 minutes here on a slow mirror (2026-11-19)
      - name: Linux libraries
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          bash .github/scripts/apt.sh update
          bash .github/scripts/apt.sh install libwebkit2gtk-4.1-dev build-essential \
            file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev
      - name: Rust, and both Mac targets
        timeout-minutes: 10
        working-directory: apps/desktop/src-tauri
        run: |
          rustup show active-toolchain || rustup toolchain install
          if [ "$RUNNER_OS" = macOS ]; then rustup target add aarch64-apple-darwin x86_64-apple-darwin; fi
      - run: bun install --frozen-lockfile
      # installed apps take only updates signed with the key in tauri.conf.json
      - name: The updater's key
        run: |
          if [ -n "$KEY" ] && bun scripts/release.ts desktop-key; then
            { echo 'TAURI_SIGNING_PRIVATE_KEY<<EOF'; echo "$KEY"; echo 'EOF'
              echo 'TAURI_SIGNING_PRIVATE_KEY_PASSWORD<<EOF'; echo "$PASSWORD"; echo 'EOF'; } >> "$GITHUB_ENV"
          elif [ "$DRY_RUN" = true ]; then
            echo "::warning::No release key for the desktop app's updates; signed with the development key. A real release would stop here."
            { echo 'TAURI_SIGNING_PRIVATE_KEY<<EOF'; cat apps/desktop/keys/development.key; echo; echo 'EOF'
              echo 'TAURI_SIGNING_PRIVATE_KEY_PASSWORD='; } >> "$GITHUB_ENV"
          else
            echo "The release environment needs TAURI_SIGNING_PRIVATE_KEY, and tauri.conf.json its public half (apps/desktop/keys/README.md)." >&2
            exit 1
          fi
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          DRY_RUN: ${{ inputs.dry-run }}
      # Tauri signs and notarizes when these are set, and builds an unsigned app when they aren't
      - name: The Mac app's signing, when the owner has added it
        if: runner.os == 'macOS'
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY; do
              { echo "$name<<EOF"; printenv "$name"; echo 'EOF'; } >> "$GITHUB_ENV"
            done
            printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          else
            echo "::warning::The Mac app is unsigned: the release environment has no Apple certificate yet."
          fi
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      - name: The app, its installers and the updater's artifacts
        working-directory: apps/desktop
        run: bun run tauri build --ci --target ${{ matrix.target }} --config '{"bundle":{"createUpdaterArtifacts":true}}' -- --locked
        # Tauri runs the client's desktop export first (tauri.conf.json's beforeBuildCommand)
        env:
          EXPO_NO_TELEMETRY: 1
      # before anything is gathered: a page that doesn't come alive stops the release (HT-107,
      # desktop.yml's step of the same name)
      - name: The page comes alive under Tauri's policy
        if: runner.os == 'macOS'
        timeout-minutes: 10
        run: |
          bunx playwright-core install webkit
          bun scripts/sweeps/desktop.ts
      - name: Gather them
        run: |
          mkdir -p "$RUNNER_TEMP/desktop"
          find "apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle" -type f \
            \( -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' -o -name '*-setup.exe' \
               -o -name '*-setup.exe.sig' -o -name '*.AppImage' -o -name '*.AppImage.sig' \
               -o -name '*.deb' -o -name '*.rpm' \) -exec cp {} "$RUNNER_TEMP/desktop/" \;
          ls -l "$RUNNER_TEMP/desktop"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ matrix.target }}
          path: ${{ runner.temp }}/desktop/

  # the updater's feed and the installers' sums, from all three
  desktop-feed:
    needs: [prepare, desktop]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.desktop.result == 'success' }}
    runs-on: ubuntu-24.04
    # under a minute in the last six releases (2026-11-18 and 19)
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-files
          path: ${{ github.workspace }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: desktop-*
          merge-multiple: true
          path: ${{ runner.temp }}/desktop
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: latest.json and SHA256SUMS
        run: |
          bun scripts/release.ts feed "$VERSION" "$RUNNER_TEMP/desktop" > "$RUNNER_TEMP/latest.json"
          rm "$RUNNER_TEMP"/desktop/*.sig
          mv "$RUNNER_TEMP/latest.json" "$RUNNER_TEMP/desktop/"
          (cd "$RUNNER_TEMP/desktop" && sha256sum -- * > SHA256SUMS)
          cat "$RUNNER_TEMP/desktop/latest.json" "$RUNNER_TEMP/desktop/SHA256SUMS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop
          path: ${{ runner.temp }}/desktop/

  # May the release publish? Every build ended as the release needs: passed, or skipped on purpose
  # (spk and the desktop app on a prerelease), by scripts/release-gate.ts's rule. It runs whatever
  # the builds did (`!cancelled()`) and fails unless the rule says go; `merge` and `pages` need it
  # to have passed, and `github-release` reads its result before the tag. GitHub's docs give a
  # job's result in `needs` as success, failure, cancelled or skipped and say nothing of a matrix;
  # run 44371744243 showed one cancelled macOS build leaving `desktop`'s result short of success
  # (`desktop-feed`, which needs it to be success, was skipped), so one build that never got a
  # runner is enough to stop it (ADR 0050's second 2026-11-18 note;
  # https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#needs-context).
  # It runs on a dry run too, so a dry run shows the verdict a real one would act on.
  publishable:
    if: ${{ !cancelled() }}
    needs: [prepare, checks, image, catalog, spk, desktop, desktop-feed]
    runs-on: ubuntu-24.04
    # under a minute in the last six releases (2026-11-18 and 19)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Every build the release needs passed
        run: bun scripts/release-gate.ts builds
        env:
          NEEDS: ${{ toJSON(needs) }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          DRY_RUN: ${{ inputs.dry-run }}

  # Publishing, after `publishable` and only on a real release, in order of how hard each is to
  # take back, with what a failure at each step leaves and how a re-run recovers. "Re-run failed
  # jobs" runs the failed jobs and every job that depends on them again, and the jobs that passed
  # keep their results and outputs
  # (https://docs.github.com/en/actions/how-tos/manage-workflow-runs/re-run-workflows-and-jobs).
  #
  #   publishable fails: nothing is published. Once the failed build can pass (a runner that never
  #     came, a flaky step), re-run failed jobs: it, `publishable` and everything after run again.
  #   1. merge, the image's tags (`0.4.3`, `0.4`, `latest`, `beta` as release.ts picks them). A
  #     tag can be moved back to the digest it had, but whoever pulled it in between has it. A
  #     failure leaves some tags moved at most; nothing reads the release yet, and re-running
  #     failed jobs pushes the same digests under the same tags again.
  #   2. pages, catalog.highsea.tv, whose newest entry tells every server the version is out. A
  #     redeploy takes it back. A failure leaves the image's tags out and the catalog as it was;
  #     re-run failed jobs.
  #   3. github-release, last: the tag, the GitHub release, which packages.highsea.tv (Package
  #     Center) and the desktop app's updater read from the Latest release, and next and main
  #     moved. A failure before the release takes the tag back (below); re-run failed jobs, and
  #     its gate reads the jobs carried over from the earlier attempt with their results. A failure
  #     after it leaves the release out and next or main to merge by hand, as its error says.
  merge:
    if: >-
      ${{ !cancelled() && !inputs.dry-run && needs.prepare.result == 'success'
        && needs.publishable.result == 'success' }}
    needs: [prepare, publishable]
    runs-on: ubuntu-24.04
    # about a minute in the last six releases (2026-11-18 and 19)
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Sign in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      # GitHub shows a multi-arch image's description from the index's annotations
      # (https://docs.github.com/en/packages/working-with-a-github-packages-registry/working-with-the-container-registry)
      - name: Both platforms, under every tag
        working-directory: ${{ runner.temp }}/digests
        run: |
          tags=()
          while read -r tag; do [ -n "$tag" ] && tags+=(--tag "$IMAGE:$tag"); done <<< "$IMAGE_TAGS"
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" \
            --annotation "index:org.opencontainers.image.description=Find, download and organise your films, with their subtitles, and serve them to your own apps. One self-hosted server in place of Radarr, Prowlarr, qBittorrent and Bazarr." \
            --annotation "index:org.opencontainers.image.source=https://github.com/highsea-tv/highsea-tv" \
            --annotation "index:org.opencontainers.image.licenses=AGPL-3.0-only" \
            --annotation "index:org.opencontainers.image.version=$VERSION" \
            "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
        env:
          IMAGE_TAGS: ${{ needs.prepare.outputs.tags }}

  pages:
    if: >-
      ${{ !cancelled() && !inputs.dry-run && needs.publishable.result == 'success'
        && needs.merge.result == 'success' }}
    needs: [publishable, merge]
    runs-on: ubuntu-24.04
    # under a minute in the last six releases (2026-11-18 and 19)
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  # The tag, the GitHub release and, from next, next and main moved to the release commit. It
  # names the `release` environment, for the deploy key, and waits on `checks` like the other
  # keyed jobs so the owner's one approval covers it too; then, before it pushes anything, it waits
  # for every job it publishes after, `publishable`, `merge` and `pages` among them, and stops
  # unless each ended as the release needs: passed, or skipped on purpose (spk and the desktop app
  # on a prerelease). It reads them instead of naming them in `needs`, which would bring it to the
  # `release` environment after the builds and ask the owner for a second approval. That rule is
  # scripts/release-gate.ts's, read from the run's own jobs
  # (https://docs.github.com/en/rest/actions/workflow-jobs#list-jobs-for-a-workflow-run-attempt),
  # and `outcome` below applies the same rule to the whole run.
  #
  # next and main are protected by rulesets that require pull requests. The deploy key in the
  # `release` environment, RELEASE_DEPLOY_KEY, is the rulesets' one bypass for a workflow (actor
  # type DeployKey, https://docs.github.com/en/rest/repos/rules#create-a-repository-ruleset), and
  # actions/checkout configures git to push with it (`ssh-key`,
  # https://github.com/actions/checkout#usage). A push with a deploy key, unlike one with
  # GITHUB_TOKEN, starts the branches' own workflows
  # (https://docs.github.com/en/actions/concepts/security/github_token), so next runs CI on the
  # release commit and main's push deploys docs.highsea.tv (ADR 0050's 2026-10-23 section).
  github-release:
    if: ${{ !cancelled() && !inputs.dry-run && needs.prepare.result == 'success' && needs.checks.result == 'success' }}
    needs: [prepare, checks]
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 240
    permissions:
      contents: write
      actions: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      COMMIT: ${{ needs.prepare.outputs.commit }}
      FROM_NEXT: ${{ github.ref == 'refs/heads/next' }}
    steps:
      - name: The deploy key is there, for a release from next
        if: ${{ github.ref == 'refs/heads/next' }}
        run: |
          if [ -z "$KEY" ]; then
            echo "The release environment needs RELEASE_DEPLOY_KEY, a deploy key with write access that the next and main rulesets let bypass them (ADR 0050's 2026-11-17 section)." >&2
            exit 1
          fi
        env:
          KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ssh-key: ${{ github.ref == 'refs/heads/next' && secrets.RELEASE_DEPLOY_KEY || '' }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # nothing is pushed or published before this passes (scripts/release-gate.ts imports nothing,
      # so it runs without `bun install`)
      - name: Everything the release needs passed
        run: bun scripts/release-gate.ts wait
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          DRY_RUN: ${{ inputs.dry-run }}
      - if: ${{ needs.prepare.outputs.bundle == 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-bundle
          path: ${{ runner.temp }}
      - name: The release commit, from prepare
        if: ${{ needs.prepare.outputs.bundle == 'true' }}
        run: |
          git bundle verify "$RUNNER_TEMP/release.bundle"
          git fetch "$RUNNER_TEMP/release.bundle" release-commit
          [ "$(git rev-parse FETCH_HEAD)" = "$COMMIT" ] || { echo "The bundle holds $(git rev-parse FETCH_HEAD), not $COMMIT." >&2; exit 1; }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-notes
          path: ${{ runner.temp }}
      - if: ${{ needs.prepare.outputs.prerelease == 'false' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: spk
          path: ${{ runner.temp }}/assets
      - if: ${{ needs.prepare.outputs.prerelease == 'false' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop
          path: ${{ runner.temp }}/assets
      # From next the tag is pushed first, on the release commit, which isn't on a branch yet;
      # from main, creating the release makes the tag on main's commit
      # (https://cli.github.com/manual/gh_release_create)
      - name: The tag
        id: tag
        if: ${{ github.ref == 'refs/heads/next' }}
        run: git push origin "$COMMIT:refs/tags/v$VERSION"
      - name: The release
        id: release
        run: |
          kind=()
          if [ "$PRERELEASE" = true ]; then kind+=(--prerelease); fi
          # GitHub's Latest follows the image's `latest`, so a fix to an older line doesn't take it
          if grep -qx latest <<< "$TAGS"; then kind+=(--latest); else kind+=(--latest=false); fi
          if [ "$FROM_NEXT" = true ]; then kind+=(--verify-tag); else kind+=(--target "$COMMIT"); fi
          shopt -s nullglob
          # the package and its manifest, which packages.highsea.tv reads from the Latest release; the
          # desktop app's installers, their sums and the updater's latest.json, which the app reads
          # from the Latest release too
          assets=("$RUNNER_TEMP"/assets/*.spk "$RUNNER_TEMP"/assets/highsea-spk.json \
            "$RUNNER_TEMP"/assets/*.dmg "$RUNNER_TEMP"/assets/*.app.tar.gz "$RUNNER_TEMP"/assets/*-setup.exe \
            "$RUNNER_TEMP"/assets/*.AppImage "$RUNNER_TEMP"/assets/*.deb "$RUNNER_TEMP"/assets/*.rpm \
            "$RUNNER_TEMP"/assets/latest.json "$RUNNER_TEMP"/assets/SHA256SUMS)
          gh release create "v$VERSION" "${assets[@]}" --repo "$GITHUB_REPOSITORY" \
            --title "highsea $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" "${kind[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          TAGS: ${{ needs.prepare.outputs.tags }}
      # A tag pushed without its release would make the next run pick the patch after it, so it's
      # taken back and a new run releases the same version (`failure()` runs this step only when
      # one before it failed, https://docs.github.com/en/actions/reference/workflows-and-actions/expressions#failure)
      - name: No tag without its release
        if: ${{ failure() && steps.tag.outcome == 'success' && steps.release.outcome != 'success' }}
        run: git push origin ":refs/tags/v$VERSION"
      # next and main to the release commit, by fast-forward: a plain push, which git refuses
      # unless it's one (git-push(1)). If next moved on during the release, the release commit
      # is merged into it instead; main must not have moved, since only the owner's merge or a
      # release changes it, and if it did the owner merges by hand. The release is out either way.
      - name: next and main at the release commit
        if: ${{ github.ref == 'refs/heads/next' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git push origin "$COMMIT:refs/heads/next"; then
            echo "next is at $COMMIT."
          else
            git fetch origin next
            git checkout -q --detach origin/next
            if git merge --no-ff --no-edit -m "Merge the $VERSION release into next" "$COMMIT" && git push origin "HEAD:refs/heads/next"; then
              echo "::warning::next moved on during the release, so the release commit was merged into it."
            else
              echo "::error::v$VERSION is released, but next couldn't take its commit $COMMIT; merge it into next by hand."
              exit 1
            fi
          fi
          if git push origin "$COMMIT:refs/heads/main"; then
            echo "main is at $COMMIT."
          else
            echo "::error::v$VERSION is released and next has it, but main couldn't fast-forward to $COMMIT; merge next into main by hand."
            exit 1
          fi

  # The run's verdict, by the same rule as `github-release` (scripts/release-gate.ts): it fails
  # unless every job the release needs passed and the rest were skipped on purpose, so a dry run
  # that skipped a build fails instead of looking green. It runs whatever the others did and stops
  # on a cancel (the note above `image`).
  outcome:
    if: ${{ !cancelled() }}
    needs:
      - prepare
      - checks
      - image
      - catalog
      - spk
      - desktop
      - desktop-feed
      - publishable
      - merge
      - pages
      - github-release
    runs-on: ubuntu-24.04
    # seconds in the last six releases (2026-11-18 and 19)
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Every job ended as the release needs
        run: bun scripts/release-gate.ts needs
        env:
          NEEDS: ${{ toJSON(needs) }}
