# SPDX-License-Identifier: AGPL-3.0-only
# A catalog-only publish (docs/plans/indexer-catalog-upkeep.md, part A; ADR 0069), run by hand from
# next: a fixed or new indexer definition reaches servers within hours, without a highsea release.
#
#   1. check: from next only; the catalog's tests and licence audit; and `catalog.ts publishable`,
#      which needs CHANGES.md's newest heading to be newer than both published channels (servers
#      fetch a bundle only when its version is newer, ADR 0050) and releases.json to be what's
#      published, so the releases servers know of don't change.
#   2. catalog: the same steps as release.yml's `catalog` job, from .github/actions/catalog: both
#      channels built and signed with the release key, the trust check, the upload. It names the
#      `release` environment, so it waits for the owner's approval and the key reaches no other job
#      (https://docs.github.com/en/actions/how-tos/deploy/configure-and-manage-deployments/manage-environments).
#   3. pages: catalog.highsea.tv deployed, unless it's a dry run
#      (https://docs.github.com/en/pages/getting-started-with-github-pages/using-custom-workflows-with-github-pages).
#
# It shares the `release` concurrency group with release.yml: groups are the repository's, not one
# workflow's, so a release and a catalog publish never deploy Pages at once
# (https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#concurrency).
# Every job has a timeout (`timeout-minutes`, the same page). Each action is pinned to a full commit
# SHA, with its version beside it.
name: Catalog release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Check, build and sign, and publish nothing
        required: true
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: From next
        if: ${{ github.ref != 'refs/heads/next' }}
        run: |
          echo "::error::Run the catalog release from next (it's run from $GITHUB_REF_NAME)."
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Every definition validates, and the stages' rules hold
        run: bun test --isolate packages/schemas packages/catalog packages/indexers scripts/catalog.test.ts scripts/catalog-check.test.ts
      - name: Every definition is CC0-1.0 or MIT
        run: bun run licenses
      - name: A version servers don't have yet, and the releases they know of unchanged
        run: bun scripts/catalog.ts publishable https://catalog.highsea.tv

  catalog:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/catalog
        with:
          catalog-key: ${{ secrets.HIGHSEA_CATALOG_KEY }}
          catalog-key-id: ${{ secrets.HIGHSEA_CATALOG_KEY_ID }}
          dry-run: ${{ inputs.dry-run }}

  pages:
    if: ${{ !inputs.dry-run }}
    needs: catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
