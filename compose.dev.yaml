# highsea built from this checkout, for development: compose.yaml's setup on the image you build.
#   docker compose -f compose.dev.yaml up --build
# Its folders are under .dev/docker (gitignored). The other compose files run the published image.
services:
  highsea:
    build: .
    image: highsea:dev
    container_name: highsea
    network_mode: host
    volumes:
      - ./.dev/docker/config:/config
      # one root for downloads and the library, so imports can hardlink
      - ./.dev/docker/data:/data
      # graphics as compose.yaml hands them over (ADR 0057)
      - /dev/dri:/dev/dri
    device_cgroup_rules:
      - "c 226:128 rw"
      - "c 226:129 rw"
      - "c 226:130 rw"
      - "c 226:131 rw"
      - "c 226:132 rw"
      - "c 226:133 rw"
      - "c 226:134 rw"
      - "c 226:135 rw"
    restart: unless-stopped
