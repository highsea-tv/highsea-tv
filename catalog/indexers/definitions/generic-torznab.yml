# SPDX-License-Identifier: CC0-1.0
# Written for highsea from the Torznab specification; no definition was copied.
id: generic-torznab
version: 1.0.0
minEngineVersion: 1.0.0
name: Torznab
description: Any indexer that speaks Torznab, including one you already run in Prowlarr or Jackett.
kind: torznab
privacy: private
language: en
baseUrl: '{{ .Config.baseUrl }}'
categories:
  - { id: '2000', standard: 2000 }
  - { id: '2030', standard: 2030 }
  - { id: '2040', standard: 2040 }
  - { id: '2045', standard: 2045 }
  - { id: '2050', standard: 2050 }
settings:
  - key: baseUrl
    label: Address
    type: url
    required: true
    help: >-
      The feed's address without /api at the end. In Prowlarr, open the indexer and copy its
      Torznab feed. In Jackett, copy the indexer's Torznab feed.
  - key: apiKey
    label: API key
    type: password
    help: The API key the feed asks for. Prowlarr and Jackett show theirs in Settings.
login: { method: apikey }
api:
  path: /api
  apiKey: '{{ .Config.apiKey }}'
rateLimit: { requests: 30, seconds: 60 }
source:
  author: highsea
  documentation: https://torznab.github.io/spec-1.3-draft/torznab/Specification-v1.3.html
license: CC0-1.0
