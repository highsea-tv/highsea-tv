# SPDX-License-Identifier: AGPL-3.0-only
# The D-pad walk's test project (scripts/sweeps/tv.ts), generated with XcodeGen
# (https://github.com/yonaskolb/XcodeGen/blob/master/Docs/ProjectSpec.md). A UI testing bundle with
# no target application: the walk launches the installed app by its bundle identifier
# (XCUIApplication(bundleIdentifier:)), as phone.ts drives an installed build with Maestro, so the
# app's own generated project stays as expo prebuild leaves it.
name: DpadWalk
options:
  bundleIdPrefix: tv.highsea
  deploymentTarget:
    tvOS: "16.4"
targets:
  DpadWalk:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - DpadWalk.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
schemes:
  DpadWalk:
    build:
      targets:
        DpadWalk: [test]
    test:
      targets:
        - DpadWalk
