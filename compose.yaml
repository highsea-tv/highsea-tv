# highsea on one machine: the file the Docker guide shows and get.highsea.tv's installer writes.
#   docker compose up -d
# Then open http://<this machine>:3000 and follow the setup.
#
# highsea has its own network with published ports, so the built-in VPN can make its WireGuard
# interface and routes for highsea alone, never the host's (ADR 0042, 2026-11-19). The apps find
# the server by its broadcast on 7368/udp and by mDNS through the host's avahi (ADR 0020), and the
# torrent engine takes incoming peers on 6881 (ADR 0037): forward 6881 on your router for them, or
# use a VPN that forwards a port. The guides: https://docs.highsea.tv/install/docker/ and
# https://docs.highsea.tv/settings/vpn/
services:
  highsea:
    # `latest` is the newest stable release; pin a version (0.1.0) to choose when you move
    image: ghcr.io/highsea-tv/highsea:latest
    container_name: highsea
    ports:
      # the admin, the web app and the apps' address
      - "3000:3000"
      # the torrent engine's incoming peers, TCP and UDP
      - "6881:6881/tcp"
      - "6881:6881/udp"
      # apps on your network find highsea by this broadcast
      - "7368:7368/udp"
    # the built-in VPN's WireGuard interface and routes, in highsea's own network. Where the kernel
    # has no WireGuard, highsea uses wireguard-go on the TUN device, which it makes itself
    cap_add: [NET_ADMIN]
    # highsea runs as whoever owns /data, and takes the time zone from your browser at setup.
    # To choose instead, or to give the address people use from outside:
    # environment:
    #   PUID: "1000"
    #   PGID: "1000"
    #   TZ: Europe/London
    #   HIGHSEA_PUBLIC_URL: https://highsea.example.net
    volumes:
      # the database, settings, logs and backups
      - ./config:/config
      # one folder for downloads and the library, on one disk, so imports can hardlink instead of
      # copying: change ./data to where your films live
      - ./data:/data
      - /dev/dri:/dev/dri
      # where the host runs avahi, highsea publishes through it instead of answering mDNS itself
      # (ADR 0020); on a host without D-Bus, Docker makes an empty folder and nothing changes
      - /run/dbus:/run/dbus:ro
    # Intel and AMD graphics, for hardware acceleration (ADR 0056, 0057). The bind mount, unlike
    # `devices:`, starts on a host without graphics too (Docker makes an empty folder), and the rules
    # let highsea open the render nodes (226:128 to 226:135) and nothing else. highsea checks what
    # it finds at start and joins the device's group by itself.
    # NVIDIA needs no lines here: install NVIDIA's container toolkit on the host and make it Docker's
    # default runtime (`nvidia-ctk runtime configure --runtime=docker --set-as-default`).
    device_cgroup_rules:
      - "c 226:128 rw"
      - "c 226:129 rw"
      - "c 226:130 rw"
      - "c 226:131 rw"
      - "c 226:132 rw"
      - "c 226:133 rw"
      - "c 226:134 rw"
      - "c 226:135 rw"
    # a restore in System › Backups restarts highsea by exiting with code 75; this brings it back
    # (ADR 0047), and so does a reboot
    restart: unless-stopped
