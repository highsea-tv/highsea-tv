<!doctype html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>B · Signal — highsea.tv</title>
    <meta name="description" content="highsea.tv brand direction B: Signal — a precise graphite instrument with one ember of color." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="shared/board.css" />
    <link rel="stylesheet" href="shared/layouts.css" />
    <style>
      :root {
        --bg: #0a0a0b;
        --s1: #111113;
        --s2: #17171a;
        --s3: #1e1e22;
        --s4: #27272c;
        --line: rgb(255 255 255 / 0.07);
        --line-strong: rgb(255 255 255 / 0.13);
        --text: #f3f3f1;
        --text-2: #c3c3bf;
        --text-3: #a1a19d;
        --accent: #ff6b3d;
        --accent-2: #ffb23d;
        --accent-ink: #1c0800;
        --accent-fill: #c43d0f;
        --on-accent: #ffffff;
        --accent-text: #ff9f81;
        --danger-fill: #b02a3a;
        --accent-soft: rgb(255 107 61 / 0.14);
        --success: #3ccf7e;
        --warning: #f5c542;
        --danger: #ff4d6a;
        --info: #7aa7ff;
        --focus: #ff6b3d;

        --radius-sm: 6px;
        --radius: 8px;
        --radius-lg: 10px;
        --radius-xl: 14px;
        --radius-poster: 6px;

        --font-display: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
        --font-body: 'Inter', ui-sans-serif, system-ui, sans-serif;
        --font-mono: 'JetBrains Mono', ui-monospace, monospace;
        --display-weight: 600;
        --display-tracking: -0.03em;

        --cover-bg:
          linear-gradient(rgb(255 255 255 / 0.035) 1px, transparent 1px) 0 0 / 44px 44px,
          linear-gradient(90deg, rgb(255 255 255 / 0.035) 1px, transparent 1px) 0 0 / 44px 44px,
          radial-gradient(ellipse 50% 60% at 86% 14%, rgb(255 107 61 / 0.22), transparent 60%),
          #0a0a0b;
        --icon-bg: linear-gradient(180deg, #1c1c20, #0e0e10);
        --tv-focus: 0 0 0 3px var(--bg), 0 0 0 6px #f3f3f1;
        --tv-btn-radius: 6px;
        --btn-radius: 6px;
        --badge-radius: 4px;
        --nav-active-bg: var(--s3);
      }

      body {
        font-feature-settings: 'cv11', 'ss01';
      }

      .tv-inner {
        --tv-focus: 0 0 0 calc(var(--u) * 0.18) var(--bg), 0 0 0 calc(var(--u) * 0.4) #f3f3f1;
        --tv-btn-radius: calc(var(--u) * 0.35);
      }

      .art {
        --poster-art: linear-gradient(165deg, hsl(var(--h) 42% 30%), hsl(var(--h) 30% 11%) 72%);
        --poster-motif-sat: 70%;
        --poster-motif-l: 62%;
        --poster-motif-o: 0.75;
        --poster-case: uppercase;
        --poster-tracking: 0.02em;
        --poster-size: 0.86em;
      }

      .nav-item.on::before {
        content: '';
        position: absolute;
        left: -10px;
        top: 8px;
        bottom: 8px;
        width: 2px;
        border-radius: 2px;
        background: var(--accent);
      }

      .sec-title {
        font-weight: 500;
      }

      .wm {
        display: inline-flex;
        align-items: center;
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 0.62em;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        line-height: 1;
      }

      .wm-tld {
        margin-left: 0.55em;
        padding: 0.18em 0.32em 0.14em 0.4em;
        border: 1.5px solid var(--accent);
        border-radius: 0.22em;
        font-size: 0.72em;
        letter-spacing: 0.1em;
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <noscript>This board needs JavaScript.</noscript>

    <script src="shared/board.js"></script>
