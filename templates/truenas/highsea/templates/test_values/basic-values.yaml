TZ: Etc/UTC

resources:
  limits:
    cpus: 2.0
    memory: 4096

highsea:
  public_url: ""
  avahi: false
  additional_envs: []

network:
  host_network: false
  web_port:
    bind_mode: published
    port_number: 8080
  torrent_port:
    bind_mode: published
    port_number: 6882
  discovery_port:
    bind_mode: published
    port_number: 7369

run_as:
  user: 568
  group: 568

ix_volumes:
  config: /opt/tests/mnt/config
  data: /opt/tests/mnt/data

storage:
  config:
    type: ix_volume
    ix_volume_config:
      dataset_name: config
      create_host_path: true
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  additional_storage: []
