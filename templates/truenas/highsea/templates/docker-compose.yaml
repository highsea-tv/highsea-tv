{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.highsea_container_name, "image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perm_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{# highsea's entrypoint starts as root, joins the graphics' group and drops to PUID:PGID, as Plex's does #}
{% do c1.set_user(0, 0) %}
{% do c1.add_caps(["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID", "KILL"]) %}
{% do c1.healthcheck.set_test("node", {"port": values.consts.internal_web_port, "path": "/api/health"}) %}

{% if values.highsea.public_url %}
  {% do c1.environment.add_env("HIGHSEA_PUBLIC_URL", values.highsea.public_url) %}
{% endif %}
{% do c1.environment.add_user_envs(values.highsea.additional_envs) %}

{% if not values.network.host_network %}
  {% do c1.add_port(values.network.web_port, {"container_port": values.consts.internal_web_port}) %}
  {% do c1.add_port(values.network.torrent_port, {"container_port": values.consts.internal_torrent_port}) %}
  {% do c1.add_port(values.network.torrent_port, {"container_port": values.consts.internal_torrent_port, "protocol": "udp"}) %}
  {% do c1.add_port(values.network.discovery_port, {"container_port": values.consts.internal_discovery_port, "protocol": "udp"}) %}
{% endif %}

{% do c1.add_storage("/config", values.storage.config) %}
{% do perm_container.add_or_skip_action("config", values.storage.config, perm_config) %}
{% do c1.add_storage("/data", values.storage.data) %}
{% do perm_container.add_or_skip_action("data", values.storage.data, perm_config) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perm_config) %}
{% endfor %}

{# mDNS through the host's avahi, read only (ADR 0020) #}
{% if values.highsea.avahi %}
  {% do c1.add_dbus() %}
{% endif %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port, {"port": values.consts.internal_web_port if values.network.host_network else None}) %}

{{ tpl.render() | tojson }}
