# highsea's Synology package (install-simplicity.md, part D). Container Manager's docker-project
# worker creates this project before postinst and only starts it afterwards
# (https://help.synology.com/developer-guide/resource_acquisition/docker-project.html), so the
# values that differ by NAS come from .env, which preinst writes into the unpacked package first.
# Container Manager runs it as the package's own user (it adds `user:` in docker-compose.admin.yaml),
# so highsea runs as that user, which the data-share worker gave read and write on the shared folder.
services:
  highsea:
    image: ghcr.io/highsea-tv/highsea:@VERSION@
    container_name: highsea
    # the NAS's own name, which setup offers as the server's (a container's is its id otherwise)
    hostname: ${HIGHSEA_HOSTNAME:-highsea}
    # the built-in VPN (ADR 0042, 2026-11-19): its WireGuard interface and routes, in this container's
    # own network. The container starts as the package's user, so the image's entrypoint raises the
    # capability for highsea itself (docker/entrypoint.sh)
    cap_add: [NET_ADMIN]
    environment:
      # how highsea was installed, so Settings › VPN says to update the package rather than to
      # edit a compose file nobody here writes
      HIGHSEA_INSTALL: synology
      # what highsea makes (images, previews, transcodes) in a folder of its own in the shared folder,
      # apart from the library's folders, which are chosen in setup and Settings (ADR 0057, 2026-11-17)
      HIGHSEA_WORK_DIR: /data/highsea
    volumes:
      # kept on uninstall unless the uninstall wizard is told to delete it
      - /var/packages/highsea/var/config:/config
      # the shared folder chosen at install, through the link DSM makes for the package
      - ${HIGHSEA_DATA}:/data
      # the graphics chip's folder, or an empty one on a model without it (Synology's Docker
      # won't start a container whose bind mount is missing)
      - ${HIGHSEA_DRI}:/dev/dri
      # the host's /dev/net, for the TUN device wireguard-go needs, since DSM's kernel has no
      # WireGuard: a folder rather than the device, so a module loaded later shows up here too. An
      # empty folder where DSM hasn't loaded tun, as for the graphics above; Settings › VPN says so
      - ${HIGHSEA_TUN}:/dev/net
      - /run/dbus:/run/dbus:ro
    # the render node's group (videodriver on DSM), so ffmpeg can open it (ADR 0056)
    group_add:
      - "${HIGHSEA_RENDER_GID}"
    ports:
      - "3000:3000"
      - "6881:6881/tcp"
      - "6881:6881/udp"
      - "7368:7368/udp"
    device_cgroup_rules:
      - "c 226:128 rw"
      - "c 226:129 rw"
      - "c 226:130 rw"
      - "c 226:131 rw"
      - "c 226:132 rw"
      - "c 226:133 rw"
      - "c 226:134 rw"
      - "c 226:135 rw"
    # a restore in System › Backups restarts highsea by exiting with code 75 (ADR 0047)
    restart: unless-stopped
